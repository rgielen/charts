apiVersion: v2
name: manifest-llm-gateway
description: Manifest, the self-hosted LLM gateway, proxy and dashboard.
type: application

# The chart's own version. Bumped on every change to this directory.
version: 2.11.2
# The packaged upstream version. Quoted so a two-segment tag stays a string.
appVersion: "6.28.4"

keywords:
  - llm
  - gateway
  - proxy
  - openai
  - anthropic
  - ollama
  - ai

home: https://manifest.build
# The path the upstream site links itself; /favicon.ico there is a 404 that
# answers with an HTML error page, which every consumer of this field -- the
# chart pages, ArtifactHub, any Helm UI -- renders as a broken image.
icon: https://manifest.build/images/favicon.png
sources:
  - https://github.com/mnfst/llm-gateway
  - https://github.com/rgielen/charts

maintainers:
  - name: rgielen
    url: https://github.com/rgielen

annotations:
  # Read by .github/workflows/upstream-sync.yaml. It watches the image for new
  # tags matching the pattern and opens a pull request that bumps appVersion and
  # this chart's version together -- the bump Renovate cannot do on its own.
  charts.rgielen.de/upstream-image: docker.io/manifestdotbuild/manifest
  # Keeps `latest`, `6`, `6.19`, `sha-<commit>` and the `*.sig` cosign tags out.
  charts.rgielen.de/upstream-tag-pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
  # The upstream tags releases as `manifest@<version>`, not `v<version>` -- and
  # does not cut one for every image tag, so this link is checked before it is
  # used rather than assumed to resolve. The repository was renamed from
  # mnfst/manifest, which the image's org.opencontainers.image.source label
  # already reported at 6.23.4; the old name still redirects, but only until
  # someone creates a repository under it.
  charts.rgielen.de/upstream-releases: https://github.com/mnfst/llm-gateway/releases/tag/manifest@{version}
  # Files chart_audit.py reads to learn what the upstream documents as its
  # configuration. None of them is complete: MIGRATION_DATABASE_URL appears in
  # neither .env.example, and 6.26.1's MANIFEST_RATE_MAX_REQUESTS is read in the
  # proxy's rate limiter, not in app.config.ts.
  charts.rgielen.de/upstream-config-sources: packages/backend/src/config/app.config.ts,packages/backend/.env.example,docker/.env.example
  # The code that runs in the image. chart_audit.py scans it for every
  # process.env read the sources above do not account for.
  charts.rgielen.de/upstream-source-roots: packages/backend/src
  # Files compared between the old and the new image's commit before a bump is
  # merged unattended. One line on purpose: Chart.yaml here is read line-based
  # so its comments survive an automated bump, and that reader does not follow
  # folded scalars.
  charts.rgielen.de/upstream-watch-paths: docker/.env.example,docker/docker-compose.yml,packages/backend/.env.example,packages/backend/src/config/app.config.ts
