apiVersion: v2
name: manifest-llm-gateway
description: Manifest, the self-hosted LLM gateway, proxy and dashboard.
type: application

# The chart's own version. Bumped on every change to this directory.
version: 2.0.3
# The packaged upstream version. Quoted so a two-segment tag stays a string.
appVersion: "6.19.1"

keywords:
  - llm
  - gateway
  - proxy
  - openai
  - anthropic
  - ollama
  - ai

home: https://manifest.build
icon: https://manifest.build/favicon.ico
sources:
  - https://github.com/mnfst/manifest
  - https://github.com/rgielen/charts

maintainers:
  - name: rgielen
    url: https://github.com/rgielen

annotations:
  # Read by .github/workflows/upstream-sync.yaml. It watches the image for new
  # tags matching the pattern and opens a pull request that bumps appVersion and
  # this chart's version together -- the bump Renovate cannot do on its own.
  charts.rgielen.de/upstream-image: docker.io/manifestdotbuild/manifest
  # Keeps `latest`, `6`, `6.19`, `sha-<commit>` and the `*.sig` cosign tags out.
  charts.rgielen.de/upstream-tag-pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
  # The upstream tags releases as `manifest@<version>`, not `v<version>` -- and
  # does not cut one for every image tag, so this link is checked before it is
  # used rather than assumed to resolve.
  charts.rgielen.de/upstream-releases: https://github.com/mnfst/manifest/releases/tag/manifest@{version}
  # Files compared between the old and the new image's commit before a bump is
  # merged unattended. `app.config.ts` is the authoritative environment surface;
  # the two .env.example files document it, and neither is complete on its own.
  # Files chart_audit.py reads to learn what the upstream actually consumes.
  # app.config.ts is the authoritative list -- neither .env.example is complete,
  # and MIGRATION_DATABASE_URL appears in neither.
  charts.rgielen.de/upstream-config-sources: packages/backend/src/config/app.config.ts,packages/backend/.env.example,docker/.env.example
  # One line on purpose: Chart.yaml here is read line-based so its comments
  # survive an automated bump, and that reader does not follow folded scalars.
  charts.rgielen.de/upstream-watch-paths: docker/.env.example,docker/docker-compose.yml,packages/backend/.env.example,packages/backend/src/config/app.config.ts
