apiVersion: v1
kind: Pod
metadata:
  name: {{ include "manifest-llm-gateway.fullname" . }}-test-health
  labels:
    {{- include "manifest-llm-gateway.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  # A separate image on purpose: the application image is distroless and has no
  # shell or HTTP client to exec into.
  containers:
    - name: health
      # renovate: datasource=docker depName=curlimages/curl
      image: curlimages/curl:8.22.0
      securityContext:
        runAsNonRoot: true
        # Numeric on purpose: the image declares its user by name (curl_user),
        # and the kubelet refuses to start a runAsNonRoot container whose user it
        # cannot verify as non-root.
        runAsUser: 100
        runAsGroup: 101
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      args:
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "10"
        - http://{{ include "manifest-llm-gateway.fullname" . }}:{{ .Values.service.port }}/api/v1/health
