{{- if .Values.httpRoute.enabled }}
{{- if not (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1") }}
{{- fail "manifest-llm-gateway: httpRoute.enabled is set but the cluster has no gateway.networking.k8s.io/v1 API. Install the Gateway API CRDs, or use ingress.enabled instead." }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "manifest-llm-gateway.fullname" . }}
  labels:
    {{- include "manifest-llm-gateway.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        {{- toYaml .Values.httpRoute.matches | nindent 8 }}
      backendRefs:
        - name: {{ include "manifest-llm-gateway.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
