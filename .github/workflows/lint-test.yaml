name: Lint and Test Charts

on:
  pull_request:
    paths:
      - "charts/**"
      - "ct.yaml"
      - ".helm-docs.gotmpl"
      - ".github/actions/helm-docs/**"
      - ".github/scripts/**"
      - ".github/workflows/lint-test.yaml"
  # Called by upstream-sync.yaml. A pull request opened with GITHUB_TOKEN does not
  # trigger `pull_request` workflows, so that workflow cannot wait for this one to
  # run on its own -- it invokes it inside its own run instead. Keeping it a
  # reusable workflow means lint and install exist exactly once.
  #
  # `inputs` is unavailable outside a workflow_call run, and an unavailable
  # context evaluates to the empty string rather than failing. On a pull_request
  # run `ref` is therefore "", which is actions/checkout's own default -- the
  # normal PR checkout. Verified on this workflow's own pull request run.
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out. Empty means the default checkout.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  lint-test:
    name: ct lint and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          # ct compares against target-branch; a shallow clone has nothing to compare to.
          fetch-depth: 0

      - uses: azure/setup-helm@v4

      # No setup-python: the action installs ct and its python tooling through uv
      # and brings its own interpreter. Pairing it with `python-version: 3.x` and
      # `check-latest: true` is what broke this workflow once already -- Python
      # 3.14 removed `ast.Num`, which the yamale version bundled with ct 3.12
      # still used, so an unrelated upstream release turned every run red.
      - uses: helm/chart-testing-action@v2.8.0

      - name: Detect changed charts
        id: list-changed
        run: |
          changed="$(ct list-changed --config ct.yaml)"
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "charts<<EOF"
              echo "$changed"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Changed charts:"
            echo "$changed"
          else
            echo "No chart changes detected -- lint and install are skipped."
          fi

      - name: Lint
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --config ct.yaml

      # Only spun up when there is something to install: starting a cluster for an
      # unchanged tree costs a minute per PR and proves nothing.
      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1

      # A chart that needs a backing service to come up ships it under
      # ci/fixtures/. ct has no pre-install hook, so the fixtures are applied here,
      # before ct install, and referenced by their in-cluster FQDN from ci/*-values.yaml.
      - name: Apply CI fixtures
        if: steps.list-changed.outputs.changed == 'true'
        env:
          CHANGED_CHARTS: ${{ steps.list-changed.outputs.charts }}
        run: |
          applied=false
          while read -r chart; do
            [[ -n "$chart" && -d "$chart/ci/fixtures" ]] || continue
            echo "Applying fixtures for $chart"
            kubectl apply -f "$chart/ci/fixtures/"
            applied=true
          done <<< "$CHANGED_CHARTS"

          if [[ "$applied" == "true" ]]; then
            kubectl wait --for=condition=Available --timeout=300s \
              --all-namespaces --selector charts.rgielen.de/ci-fixture=true deployment
          fi

      - name: Install
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --config ct.yaml

  docs:
    name: helm-docs is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/helm-docs

      - name: Fail if they differ from what is committed
        run: |
          if ! git diff --exit-code -- charts; then
            echo "::error::Chart READMEs are stale. Run the helm-docs command from CONTRIBUTING.md and commit the result."
            exit 1
          fi
