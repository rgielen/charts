name: Release Charts

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
  workflow_dispatch:

permissions:
  contents: write # chart-releaser creates GitHub releases and pushes to gh-pages
  packages: write # helm push to ghcr.io

# chart-releaser rewrites index.yaml on gh-pages, so two releases at once race
# for the same file and one of them loses its index entry while still having
# published its tag and its package. The upstream sync starts one dispatch per
# merged chart, which is one matrix entry each, so this is reachable as soon as
# a second chart exists. Never cancel: the running one is publishing.
concurrency:
  group: release-charts
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history *and tags*: chart-releaser reads them to know what is
      # already published, and the release notes are rendered against the last
      # published tag of each chart.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # chart-releaser errors out on an empty charts directory, which is the state
      # of this repository until the first chart lands.
      - name: Any charts to release?
        id: guard
        run: |
          if compgen -G "charts/*/Chart.yaml" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No chart found under charts/ -- nothing to release."
          fi

      - name: Configure Git identity
        if: steps.guard.outputs.found == 'true'
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"

      - uses: azure/setup-helm@v5
        if: steps.guard.outputs.found == 'true'

      # Packages every chart, but only creates a release for versions that do not
      # exist yet. A chart edited without a version bump is silently skipped here.
      - name: Run chart-releaser
        id: cr
        if: steps.guard.outputs.found == 'true'
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push released charts to ghcr.io
        if: steps.cr.outputs.changed_charts != ''
        env:
          CHANGED_CHARTS: ${{ steps.cr.outputs.changed_charts }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          # changed_charts is a comma-separated list of chart *paths*
          # ("charts/foo"), not bare names. Passing it to `helm show chart`
          # unprefixed made helm read it as a repository reference and fail with
          # "repo charts not found".
          IFS=',' read -ra paths <<< "$CHANGED_CHARTS"
          for path in "${paths[@]}"; do
            [[ -n "$path" ]] || continue
            name="$(basename "$path")"
            # Column-0 match: dependency versions in the same output are indented.
            version="$(helm show chart "$path" | awk '/^version:/ { print $2 }')"
            package=".cr-release-packages/${name}-${version}.tgz"
            if [[ ! -f "$package" ]]; then
              echo "::error::Expected $package for changed chart $path, but it was not packaged."
              exit 1
            fi
            helm push "$package" "oci://ghcr.io/${REGISTRY_OWNER}/charts"
          done

      # chart-releaser puts the chart's `description` in the release body and
      # nothing else -- one sentence, identical for every version, and exactly
      # what a consumer's Renovate pull request quotes back as "Release Notes".
      # This replaces it with what the repository already knows: the commits
      # behind the version, the appVersion it moved to, and the values diff.
      #
      # Everything is published by the time this runs, so a failure here means a
      # thin release body, never an unpublished chart. It still fails the run --
      # a body cannot be fixed in a pull request, only by noticing.
      - name: Write the release notes
        if: steps.cr.outputs.changed_charts != ''
        env:
          CHANGED_CHARTS: ${{ steps.cr.outputs.changed_charts }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IFS=',' read -ra paths <<< "$CHANGED_CHARTS"
          for path in "${paths[@]}"; do
            [[ -n "$path" ]] || continue
            notes="$(mktemp)"
            # The script prints the tag its notes belong to.
            tag="$(python3 .github/scripts/release_notes.py "$path" --output "$notes")"
            gh release edit "$tag" --notes-file "$notes"
            echo "Release notes written for $tag."
          done

  # Renders the browsable pages that sit next to index.yaml on gh-pages. Called
  # rather than triggered, so it runs after chart-releaser has written the index
  # this release belongs in -- a site rendered before that would be missing the
  # version that just shipped. It publishes no chart and gates nothing; a failure
  # here means a stale site, never an unpublished release.
  site:
    needs: release
    uses: ./.github/workflows/pages.yaml
