name: Upstream Image Sync

# Watches the container image behind every chart that carries the
# charts.rgielen.de/upstream-image annotation and turns a new upstream release
# into a new chart release: it bumps appVersion and the chart's own version in
# one commit, regenerates the README, opens a pull request, runs the full lint
# and install suite against it, and merges it when the bump is not a major one.
#
# The version bump is the whole point. chart-releaser packages every chart but
# publishes only versions that do not exist yet, so an appVersion change without
# a version change ships nothing and reports success -- which is exactly why
# Renovate is not allowed to automerge image updates in this repository.

on:
  schedule:
    # Nightly, at an unremarkable time. GitHub delays scheduled runs on the hour.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      # `inputs` is unavailable on a schedule run and evaluates to the empty
      # string there, which the step below turns into "no --chart argument".
      chart:
        description: Limit the check to a single chart directory name.
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  detect:
    name: Look for new upstream releases
    runs-on: ubuntu-latest
    outputs:
      # Enriched by the pull request step with the drift verdict, so the merge
      # job can gate on it. The raw detect output has no verdict yet.
      updates: ${{ steps.prepare.outputs.prepared }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install crane
        env:
          # renovate: datasource=github-releases depName=google/go-containerregistry
          CRANE_VERSION: 0.22.1
        run: |
          curl -sSfL "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane

      - name: Detect pending updates
        id: detect
        run: |
          # ${CHART:+...} expands to nothing when CHART is empty or unset, which
          # is the case on every scheduled run.
          updates="$(python3 .github/scripts/upstream_sync.py detect ${CHART:+--chart "$CHART"})"
          echo "updates=$updates" >> "$GITHUB_OUTPUT"
        env:
          CHART: ${{ inputs.chart }}

      # Install only: the regeneration happens per branch inside the loop below.
      - uses: ./.github/actions/helm-docs
        if: steps.detect.outputs.updates != '[]'
        with:
          regenerate: "false"

      - name: Open a pull request per chart
        id: prepare
        if: steps.detect.outputs.updates != '[]'
        env:
          UPDATES: ${{ steps.detect.outputs.updates }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          gh label create upstream-major --color B60205 --force \
            --description "Upstream major release; not merged automatically" > /dev/null
          gh label create upstream-review --color FBCA04 --force \
            --description "Upstream configuration surface changed; needs a look" > /dev/null

          prepared="$(mktemp)"

          # A pipe would run the loop in a subshell and lose everything written
          # to shell state, so results go to a file that survives it.
          echo "$UPDATES" | jq -c '.[]' | while read -r update; do
            name=$(jq -r .name <<< "$update")
            dir=$(jq -r .dir <<< "$update")
            branch=$(jq -r .branch <<< "$update")
            app=$(jq -r .appVersion <<< "$update")
            app_from=$(jq -r .currentAppVersion <<< "$update")
            chart_version=$(jq -r .chartVersion <<< "$update")
            chart_from=$(jq -r .currentChartVersion <<< "$update")
            bump=$(jq -r .bumpType <<< "$update")
            releases=$(jq -r .releasesUrl <<< "$update")

            if git ls-remote --exit-code --heads origin "$branch" > /dev/null 2>&1; then
              echo "$branch already exists -- leaving it alone."
              continue
            fi

            # Before anything is written: did the settings this chart models move
            # underneath it? Any doubt -- unreachable registry, missing label,
            # failed fetch -- comes back as "review" and holds the pull request.
            report="$(mktemp)"
            verdict="$(python3 .github/scripts/upstream_diff.py "$dir" "$app_from" "$app" \
              --markdown-out "$report" | jq -r .verdict || true)"
            if [ -z "$verdict" ] || [ "$verdict" = "null" ]; then
              verdict=review
              echo "### Upstream configuration surface" > "$report"
              echo >> "$report"
              echo "The drift check did not produce a verdict. Review this bump by hand." >> "$report"
            fi
            echo "$name: upstream drift verdict = $verdict"

            git checkout -B "$branch" origin/${GITHUB_REF_NAME}
            python3 .github/scripts/upstream_sync.py apply "$dir/Chart.yaml" "$app" "$chart_version"
            # The version bump changes the README badges, and the docs check in
            # lint-test.yaml would fail on this very pull request without it.
            .github/scripts/regenerate-readmes.sh

            git add "$dir"
            git commit \
              -m "feat($name): update to upstream $app" \
              -m "Chart version $chart_from -> $chart_version, appVersion $app_from -> $app."
            git push origin "$branch"

            body="$(mktemp)"
            {
              echo "Upstream \`$app_from\` → \`$app\` (${bump}), chart \`$chart_from\` → \`$chart_version\`."
              if [ -n "$releases" ]; then
                printf '\nRelease notes: %s\n' "$releases"
              else
                printf '\nThe upstream published no release for this version, so there are no release notes to link.\n'
              fi
              if [ "$bump" = "major" ]; then
                printf '\nThis is an upstream **major** release, so it is not merged automatically.\n'
              fi
              printf '\n'
              cat "$report"
            } > "$body"

            gh pr create \
              --base "$GITHUB_REF_NAME" \
              --head "$branch" \
              --title "feat($name): update to upstream $app" \
              --body-file "$body"

            if [ "$bump" = "major" ]; then
              gh pr edit "$branch" --add-label upstream-major
            fi
            if [ "$verdict" != "clean" ]; then
              gh pr edit "$branch" --add-label upstream-review
            fi

            jq -c --arg verdict "$verdict" '. + {verdict: $verdict}' <<< "$update" >> "$prepared"
          done

          jq -cs '.' "$prepared" > "$prepared.json"
          echo "prepared=$(cat "$prepared.json")" >> "$GITHUB_OUTPUT"
          cat "$prepared.json"

  # Called rather than awaited: a pull request opened with GITHUB_TOKEN does not
  # trigger `pull_request` workflows, so waiting for lint-test to appear on its
  # own would wait forever. Running it here keeps a single implementation of the
  # checks and needs no personal access token.
  verify:
    name: Verify ${{ matrix.name }}
    needs: detect
    if: needs.detect.outputs.updates != '' && needs.detect.outputs.updates != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.updates) }}
    uses: ./.github/workflows/lint-test.yaml
    with:
      ref: ${{ matrix.branch }}

  # Layer two: what a held change *means* for the chart, as opposed to whether
  # anything changed. It runs only on entries layer one already held, and nothing
  # reads its result but a comment and a label -- `merge` below requires
  # `verdict == 'clean'`, which this job cannot produce and never touches. The
  # escalate-only rule is therefore a property of the graph, not a rule somebody
  # has to keep obeying.
  #
  # The analysis is the /analyze-upstream skill in .claude/skills/, the same one
  # used interactively. Report-only is enforced three ways: the argument, an
  # allowlist of read-only tools, and removing the editing ones from the pool
  # outright -- the skill's own frontmatter grants them for interactive use.
  review:
    name: Review ${{ matrix.name }} ${{ matrix.appVersion }}
    needs: detect
    if: needs.detect.outputs.updates != '' && needs.detect.outputs.updates != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.updates) }}
    steps:
      - uses: actions/checkout@v7
        if: matrix.verdict != 'clean'
        with:
          # The bumped chart, so the skill compares against what would ship.
          ref: ${{ matrix.branch }}

      - name: Install crane
        if: matrix.verdict != 'clean'
        env:
          # renovate: datasource=github-releases depName=google/go-containerregistry
          CRANE_VERSION: 0.22.1
        run: |
          curl -sSfL "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane

      # --json-schema takes the schema itself, not a path to it. Reading the file
      # here keeps the schema reviewable as a file instead of a quoted blob in a
      # workflow argument.
      - name: Load the output schema
        id: schema
        if: matrix.verdict != 'clean'
        run: echo "json=$(jq -c . .github/schemas/upstream-review.json)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        id: analysis
        if: matrix.verdict != 'clean'
        # A failed review must not queue every later bump behind a broken token:
        # layer one already holds this pull request, so the review is additional
        # information, never the thing keeping it shut.
        continue-on-error: true
        env:
          # chart_audit.py and the skill's own `gh pr list` need an authenticated gh.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Passed explicitly so the action does not authenticate as the Claude
          # GitHub App. Nothing here is posted by Claude; the workflow posts it.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "/analyze-upstream --report-only"
          claude_args: |
            --allowedTools "Bash,Read,Grep,Glob"
            --disallowedTools "Edit,Write,NotebookEdit,AskUserQuestion"
            --json-schema '${{ steps.schema.outputs.json }}'

      - name: Post the review
        if: matrix.verdict != 'clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONCLUSION: ${{ steps.analysis.outputs.conclusion }}
          STRUCTURED: ${{ steps.analysis.outputs.structured_output }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ matrix.branch }}
        run: |
          gh label create upstream-impact --color D93F0B --force \
            --description "An upstream change affects what this chart models" > /dev/null

          body="$(mktemp)"
          hold=0
          if [[ "$CONCLUSION" != "success" ]]; then
            printf '%s' "" | python3 .github/scripts/format_review_comment.py "$RUN_URL" > "$body" || hold=$?
          else
            printf '%s' "$STRUCTURED" | python3 .github/scripts/format_review_comment.py "$RUN_URL" > "$body" || hold=$?
          fi

          gh pr comment "$BRANCH" --body-file "$body"
          if [[ "$hold" -ne 0 ]]; then
            gh pr edit "$BRANCH" --add-label upstream-impact
          fi

  merge:
    name: Merge ${{ matrix.name }}
    needs: [detect, verify]
    if: needs.detect.outputs.updates != '' && needs.detect.outputs.updates != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.updates) }}
    steps:
      - uses: actions/checkout@v7

      - name: Merge
        if: matrix.bumpType != 'major' && matrix.verdict == 'clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ matrix.branch }}" --squash --delete-branch

      - name: Leave it for review
        if: matrix.bumpType == 'major' || matrix.verdict != 'clean'
        run: |
          if [ "${{ matrix.bumpType }}" = "major" ]; then
            echo "::notice::${{ matrix.name }} ${{ matrix.appVersion }} is an upstream major release. The pull request stays open for review."
          fi
          if [ "${{ matrix.verdict }}" != "clean" ]; then
            echo "::notice::${{ matrix.name }} ${{ matrix.appVersion }}: the upstream configuration surface changed, or could not be compared. The pull request stays open, with the diff in its body."
          fi
