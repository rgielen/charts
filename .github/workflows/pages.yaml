name: Pages Site

on:
  # The same render, with the push step skipped. Without it nothing exercises the
  # generator before it reaches main: a chart pull request changes two of its
  # three inputs (Chart.yaml and the generated README), and no other check reads
  # either one the way this does.
  pull_request:
    paths:
      - "charts/**"
      - ".github/scripts/build_pages.py"
      - ".github/scripts/requirements.txt"
      - ".github/site/**"
      - ".github/workflows/pages.yaml"
  # Called by release.yaml as its last job. Ordering is the whole point: the
  # index has to carry the release before the site is rendered from it, and only
  # the release run knows when that is true. A `workflow_run` trigger would run
  # eventually; this runs after.
  workflow_call:
  workflow_dispatch:
  # Chart changes reach the site through release.yaml -- every one of them needs
  # a chart version bump, so every one of them is a release. What is left is the
  # site's own source, which no release touches.
  push:
    branches:
      - main
    paths:
      - ".github/scripts/build_pages.py"
      - ".github/scripts/requirements.txt"
      - ".github/site/**"
      - ".github/workflows/pages.yaml"

permissions:
  contents: write # pushes the rendered pages to gh-pages

# Two runs writing gh-pages at once would leave one of them rejected. Queue them
# instead of cancelling: a cancelled run is a site that silently stayed stale.
# Pull request renders write nothing, so they get a group of their own and may
# cancel freely rather than queue behind a release.
concurrency:
  group: gh-pages-site${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.number) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Render the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out the published branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: .github/scripts/requirements.txt

      - name: Install the renderer's dependencies
        run: pip install --requirement .github/scripts/requirements.txt

      # index.yaml is read, never written -- it belongs to chart-releaser.
      - name: Render the site
        run: |
          python .github/scripts/build_pages.py \
            --index gh-pages/index.yaml \
            --output gh-pages

      # So a reviewer can open the pages the change produces instead of reading
      # the generator and imagining them.
      - name: Upload the rendered site
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site
          # The action skips hidden paths, which is why the checkout above is not
          # in one: it keeps the branch's .git -- credentials and all -- out of a
          # downloadable artifact, at the cost of .nojekyll, which a local
          # preview does not need. A hidden *root* silently matches nothing, so
          # this uploaded an empty artifact and stayed green until the error
          # below was added.
          path: gh-pages
          if-no-files-found: error
          retention-days: 7

      # `github.event_name` inside a called workflow is the event that triggered
      # the caller, which for release.yaml is a push -- so this step runs there
      # and is skipped only on the pull request renders above.
      - name: Commit and push
        if: github.event_name != 'pull_request'
        working-directory: gh-pages
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "The rendered site is unchanged."
            exit 0
          fi

          git add -A
          git commit -m "docs: render the site for ${GITHUB_SHA:0:7}"

          # A release in another run can land on gh-pages between the checkout
          # above and this push. Rebasing onto it never conflicts: that run wrote
          # index.yaml, this one writes only files it renders from scratch. The
          # site it just rendered is then one index behind, and that run's own
          # pages job -- queued behind this one by the concurrency group above --
          # renders it again from the newer index.
          for attempt in 1 2 3; do
            if git push origin HEAD:gh-pages; then
              exit 0
            fi
            echo "Push rejected, rebasing onto gh-pages (attempt $attempt)."
            git pull --rebase origin gh-pages
          done
          echo "::error::Could not push the rendered site after three attempts."
          exit 1
